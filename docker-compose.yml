services:
  db:
    image: postgres:18
    container_name: configurateur-pc-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: configurateur_pc
    ports:
      - 5433:5432
    volumes:
      - db_data:/var/lib/postgresql

volumes:
    db_data: